<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <title>DFT flow: RTL to scan-inserted netlist</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1f2933">Scan insertion flow</text>
  <g font-size="13" font-weight="bold" fill="#52606d">
    <text x="40" y="66">Stage</text><text x="340" y="66">Tool</text><text x="560" y="66">Commands / files (from scan.do)</text>
  </g>
  <line x1="24" y1="74" x2="936" y2="74" stroke="#cbd2d9"/>

  <g font-size="14" fill="#1f2933">
    <!-- row template: y top, h=50, step 60 -->
    <rect x="40" y="86" width="270" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="56" y="115">1 · Functional RTL</text>
    <text x="340" y="115" fill="#52606d">—</text>

    <rect x="40" y="146" width="270" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="56" y="175">2 · Logic synthesis</text>
    <text x="340" y="175">Synopsys Design Compiler</text>

    <rect x="40" y="206" width="270" height="48" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="56" y="235">3 · Gate-level netlist</text>
    <text x="340" y="235">Design Compiler output</text>

    <rect x="40" y="266" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="295">4 · DFT context + library</text>
    <text x="340" y="295">Siemens Tessent Scan</text>

    <rect x="40" y="326" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="355">5 · Control signals + DFT DRC</text>
    <text x="340" y="355">Siemens Tessent Scan</text>

    <rect x="40" y="386" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="415">6 · Scan-cell identification</text>
    <text x="340" y="415">Siemens Tessent Scan</text>

    <rect x="40" y="446" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="475">7 · Scan insertion + stitching</text>
    <text x="340" y="475">Siemens Tessent Scan</text>

    <rect x="40" y="506" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="56" y="535">8 · Scan-chain analysis</text>
    <text x="340" y="535">Siemens Tessent Scan</text>

    <rect x="40" y="566" width="270" height="48" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="56" y="595" font-weight="bold">9 · DFT-ready netlist</text>
    <text x="340" y="595">Siemens Tessent Scan</text>

    <rect x="40" y="638" width="270" height="44" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="56" y="665" fill="#52606d">Downstream: ATPG (out of scope)</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#52606d" stroke-width="1.5" marker-end="url(#a)">
    <line x1="175" y1="134" x2="175" y2="144"/><line x1="175" y1="194" x2="175" y2="204"/>
    <line x1="175" y1="254" x2="175" y2="264"/><line x1="175" y1="314" x2="175" y2="324"/>
    <line x1="175" y1="374" x2="175" y2="384"/><line x1="175" y1="434" x2="175" y2="444"/>
    <line x1="175" y1="494" x2="175" y2="504"/><line x1="175" y1="554" x2="175" y2="564"/>
    <line x1="175" y1="614" x2="175" y2="636" stroke-dasharray="4 3"/>
  </g>

  <g font-size="12.5" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f2933">
    <text x="560" y="115" fill="#52606d">RTL not in repository</text>
    <text x="560" y="168">syn.tcl · TSMC 65 nm std-cell library</text>
    <text x="560" y="184" fill="#52606d">(script not in repository)</text>
    <text x="560" y="235">netlist_riscvcore.v</text>
    <text x="560" y="284">set_context dft -scan</text>
    <text x="560" y="299">read_verilog / read_cell_library</text>
    <text x="560" y="314">set_current_design</text>
    <text x="560" y="344">analyze_control_signals -auto_fix</text>
    <text x="560" y="359">check_design_rules</text>
    <text x="560" y="374">report_drc_rules</text>
    <text x="560" y="415">report_scan_elements</text>
    <text x="560" y="464">add_scan_mode unwrapped -chain_count 5</text>
    <text x="560" y="479">analyze_scan_chains</text>
    <text x="560" y="494">insert_test_logic</text>
    <text x="560" y="526">report_test_logic</text>
    <text x="560" y="541">report_scan_chains · report_scan_cells</text>
    <text x="560" y="588">write_design -output_file riscv_scan.v</text>
    <text x="560" y="603">write_atpg_setup scan</text>
    <text x="560" y="665" fill="#52606d">consumes the ATPG setup from step 9</text>
  </g>
  <text x="24" y="706" font-size="12" fill="#52606d">Steps 4–9 are the command sequence of scan-insertion/scripts/scan.do. Steps 1–3 are described in the report but their files are not available.</text>
</svg>
