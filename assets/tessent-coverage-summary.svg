  .grid{stroke:#d1d9e0;stroke-width:1} .base{stroke:#59636e;stroke-width:1.2}
  .c1{fill:#2a78d6} .c2{fill:#eb6834} .c3{fill:#1a4f8f} .c4{fill:#8c959f} .c5{fill:#e87ba4}
  .gap{stroke:#ffffff;stroke-width:2}
